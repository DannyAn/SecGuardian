name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  # ── 门禁 1: 项目完整性验证 (107 项) ──
  self-check:
    name: Self Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - name: Run self-check.sh (107 checks)
        run: bash scripts/self-check.sh

  # ── 门禁 2: 结构一致性验证 ──
  ci-check:
    name: CI Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - name: Run ci-check.sh
        run: bash scripts/ci-check.sh

  # ── 门禁 3~5: 多平台编译 ──
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - name: Build Go binary
        working-directory: internal
        run: go build -o secguardian-index${{ matrix.os == 'windows' && '.exe' || '' }} .
      - name: Verify version
        working-directory: internal
        run: ./secguardian-index${{ matrix.os == 'windows' && '.exe' || '' }} --version
      - name: Verify health
        working-directory: internal
        run: ./secguardian-index${{ matrix.os == 'windows' && '.exe' || '' }} --health
      - name: Verify indexing
        working-directory: internal
        run: ./secguardian-index${{ matrix.os == 'windows' && '.exe' || '' }} --path ../examples/cpp-vuln-demo/src

  # ── 门禁 6~7: Go 单元测试 ──
  test:
    name: Test ${{ matrix.os }} CGO=${{ matrix.cgo }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        cgo: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - name: Run tests
        working-directory: internal
        run: CGO_ENABLED=${{ matrix.cgo }} go test -v -cover ./...

  # ── 门禁 8: 知识库结构 ──
  knowledge:
    name: Knowledge Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count knowledge files
        run: |
          echo "Knowledge files: $(ls knowledge/guard-rules/*.md | wc -l)"
          echo "Languages: $(ls knowledge/languages/*.md | wc -l)"
          echo "Protocols: $(ls knowledge/protocols/*.md | wc -l)"
          echo "Standards: $(ls knowledge/standards/*.md | wc -l)"
      - name: Verify frontmatter completeness
        run: |
          missing=0
          for f in knowledge/guard-rules/*.md; do
            if ! grep -q "description:" "$f" || ! grep -q "cwe:" "$f" || ! grep -q "severity:" "$f"; then
              echo "Missing frontmatter fields in: $f"
              missing=$((missing + 1))
            fi
          done
          if [ $missing -gt 0 ]; then exit 1; fi

  # ── 门禁 9: 示例覆盖率 ──
  examples:
    name: Example Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count VULNERABILITY markers
        run: |
          total=$(grep -r "VULNERABILITY" examples/*/src/ 2>/dev/null | grep -c "CWE-"  || echo 0)
          echo "Total VULNERABILITY markers: $total"
          echo "CWE types: $(grep -roh 'CWE-[0-9]*' examples/*/src/ 2>/dev/null | sort -u | wc -l)"
      - name: Verify all detectors have example coverage
        run: |
          echo "Checking example coverage..."
          for f in knowledge/guard-rules/*.md; do
            cwe=$(grep "cwe:" "$f" | head -1 | sed 's/.*CWE-//;s/ .*//')
            if [ -n "$cwe" ] && ! grep -rq "CWE-$cwe" examples/*/src/ 2>/dev/null; then
              echo "MISSING example for: $(basename $f .md) (CWE-$cwe)"
            fi
          done

  # ── 门禁 10: Markdown 格式 ──
  markdown-lint:
    name: MarkdownLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v19
