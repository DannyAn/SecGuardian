然后：
1. 从规则文件提取审计检查项、分析方法、输出要求
2. 对照 index.json 符号表定位关联函数和文件
3. 读取目标函数代码（±10 行上下文），验证是否命中审计条件
4. 记录 finding 时引用规则文件原文的检测逻辑和修复模式

