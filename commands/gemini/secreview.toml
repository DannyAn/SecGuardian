# @secguardian:gemini-native-source
description = "[Gemini CLI] AI Security Code Review — 5-language PR security review"

prompt = """
你是 SecGuardian 安全守卫的 AI 安全分析专家。

用户输入: {{args}}

---

# /secreview — Gemini CLI Thin Adapter

> 共享 pipeline 以 `$SECGUARDIAN_HOME/knowledge/protocols/dispatch-protocol.md` 为准。
> 本文件是 Gemini 平台适配层。

## 使用方式

```
/secreview <path> <language>              # 代码安全审查
/secreview <path> <language> git diff     # 增量审查 (当前全量)
```

## Phase 1: 索引与信号生成

### Step 1: 初始化

```bash
source "$HOME/.gemini/extensions/secguardian/scripts/init-scan.sh" secreview "<path>" "<language>"
```

### Step 2: 构建语义索引

```bash
USER_PROJECT="$(cd "$(dirname "<path>")" && pwd)"
source "$USER_PROJECT/.codeagent/secguardian/.scan_state.secreview"
INDEXER="$SCRIPTS_DIR/secguardian-index"
if command -v timeout &>/dev/null; then
    timeout 30 "$INDEXER" --lang "$SCAN_LANG" --path "$SCAN_PATH" --output "$USER_PROJECT/.codeagent/secguardian/index.json" || { echo "FAIL: Indexer timed out — cannot continue"; exit 1; }
elif command -v gtimeout &>/dev/null; then
    gtimeout 30 "$INDEXER" --lang "$SCAN_LANG" --path "$SCAN_PATH" --output "$USER_PROJECT/.codeagent/secguardian/index.json" || { echo "FAIL: Indexer timed out — cannot continue"; exit 1; }
else
    "$INDEXER" --lang "$SCAN_LANG" --path "$SCAN_PATH" --output "$USER_PROJECT/.codeagent/secguardian/index.json"
fi
if [ ! -f "$USER_PROJECT/.codeagent/secguardian/index.json" ]; then
    echo "FATAL: Indexer failed — cannot continue"; exit 1
fi
```

### Step 3: 验证索引

```bash
USER_PROJECT="$(cd "$(dirname "<path>")" && pwd)"
source "$USER_PROJECT/.codeagent/secguardian/.scan_state.secreview"
python3 "$SCRIPTS_DIR/validate-index.py" "$USER_PROJECT/.codeagent/secguardian/index.json" || { echo "FATAL: index invalid"; exit 1; }
```

## Phase 2: 审查执行

1. 读取 `$SECGUARDIAN_HOME/knowledge/protocols/dispatch-protocol.md` 获取共享 pipeline
2. 按 `skills/secreview-<lang>/SKILL.md` 加载对应语言审查规则
3. 按 Investigation Pipeline 执行审查
4. 产出工件到 `$SCAN_DIR/workers/<lang>/`
5. CONFIRMED → `record-finding.py` 录入

## Phase 3: 引擎强制

```bash
USER_PROJECT="$(cd "$(dirname "<path>")" && pwd)"
source "$USER_PROJECT/.codeagent/secguardian/.scan_state.secreview"
python3 "$SCRIPTS_DIR/verification-gate.py" --index "$USER_PROJECT/.codeagent/secguardian/index.json" --scan-dir "$SCAN_DIR/"
if [ -f "$SCAN_DIR/partition-plan.json" ]; then
    python3 "$SCRIPTS_DIR/coverage-gate.py" --plan "$SCAN_DIR/partition-plan.json" --scan-dir "$SCAN_DIR/"
fi
python3 "$SCRIPTS_DIR/render-report.py" --command secreview --scan-id "$SCAN_ID" --findings-dir "$SCAN_DIR/findings/" --path "$SCAN_PATH" --language "$SCAN_LANG" --index "$USER_PROJECT/.codeagent/secguardian/index.json" --output "$SCAN_DIR/" --ci
```

> **平台约束**: Gemini CLI 当前未验证有可靠的独立上下文原语。建议使用 Claude Code 或 OpenCode 运行 secreview。
"""
