## Phase 2: Worker 调度

> **核心执行阶段**。Dispatcher 为每个有信号的 Skill 启动 Worker，独立执行 5 步检视协议，输出 findings。
>
> **Worker 是独立 subagent**，由 Dispatcher 通过 `Agent` 工具（`run_in_background: true`）启动。每个 Worker 接收：
> 1. 信号清单（来自 Phase 1 的 call_sites 分批）
> 2. `rules.md`（检测规则 + 检视协议，两合一）
> 3. `references/` 目录路径（豁免、误报抑制、跨函数追踪）
> 4. 源码根路径（Worker 直接读取实际代码）
>
> ⚠️ **关键约束：不得在 Dispatcher 主会话中执行 Worker 逻辑。** Worker 的源码读取、Glob/Grep/Read 工具调用必须通过 Agent 工具派发到独立 Agent 会话，不可在主会话内直接执行。多个 Worker 的核心逻辑在主会话内执行 → 全部工具调用日志填入主上下文 → 填满后 TUI 崩溃。
>
> **分批策略**：当单个 Skill 的信号数 > BATCH_SIZE(50) 时，Dispatcher 自动拆分为多个 Batch Worker。所有同 Skill Worker 完成后，Aggregator 合并产出去重。

### 5.1 Worker 启动协议

#### Step 0: 应用用户过滤器（如果指定）

```
PARSE user_filter FROM command arguments (e.g., "memory.*" or "memory.double_free")

IF user_filter IS NOT EMPTY:
  CONVERT filter TO regex patterns:
    "memory.*"            → pattern = ^memory\.
    "memory.double_free"  → pattern = ^memory\.double_free$
    "memory.*,exec.*"     → pattern = ^memory\.|^exec\.
    "" (default)          → pattern = .* (match all)

  filtered_skills = []
  FOR EACH skill IN skills WITH signals:
    IF skill.signal_filter MATCHES pattern:
      append skill TO filtered_skills
    ELSE:
      SKIP skill (no Worker dispatched)
ELSE:
  filtered_skills = ALL skills WITH signals
```

> **signal_filter 字段来源**：各 skill 的 `rules.md` frontmatter 中声明 `signal_filter`（如 `memory.buffer*`）。
> 过滤匹配基于 skill_id（如 `memory.buffer_overflow`），而非目录名。

#### Step 1: 按信号分批派发 Worker

Dispatcher 为每个过滤后的 Skill 执行以下操作：

```
FOR EACH skill IN filtered_skills:

  0. 检查信号数: len(signals) vs BATCH_SIZE (默认 50)
     IF len(signals) > BATCH_SIZE:
       → 按 §5.5 拆分为 N 个 Batch
       → n_batches = N, batches = [batch_0 .. batch_N-1]
     ELSE:
       → n_batches = 1, batches = [all_signals]
  
  FOR EACH batch IN batches:
    1. 加载 rule.md（主会话中用 bash cat）
       cat "$SECGUARDIAN_HOME/skills/secguard-<language>/rules/{skill}/rule.md"
    2. 加载 references 文件（主会话中用 bash cat）
       cat "$SECGUARDIAN_HOME/skills/secguard-<language>/rules/{skill}/references/exceptions.md"
       cat "$SECGUARDIAN_HOME/skills/secguard-<language>/rules/{skill}/references/cross-function.md"
       cat "$SECGUARDIAN_HOME/skills/secguard-<language>/rules/{skill}/references/false-positive.md"
    3. 构造 Worker 完整 prompt（含 rule + references + 信号清单 + 源码路径）
    4. 派发 Worker：Agent(description="secguard Worker: {skill}", prompt=worker_prompt, run_in_background: true)
    5. Worker 输出写入 workers/<skill_id>/batch-{N}/（由 Agent 内自行执行）
```

**并发控制**:
- 每轮最多同时派发 3 个 Worker Agent（Agent 调用可并行发起，Agent 数量限制为 3）
- 所有 Agent 派发完成后（全部 Agent 调用返回 task_id），等待所有 Agent 完成通知

> **重要**: Worker 协议从 5 轮反思升级为事实锚定反思（§5.2 W5 更新点）。
> 旧协议已被实验证伪：同 LLM 同上下文同框架 → 5 轮产出同质化结论。
> 新协议用 3 个域专用 Yes/No 事实问题替代 5 轮空转。
> 详见 `skills/secguard-cpp/` 各 skill 的 `rules.md §事实锚定反思`。

**Worker 输入结构：**

```json
{
  "dispatcher_context": {
    "scan_id": "sc-20260707-143000-a1b2",
    "scan_dir": ".codeagent/secguardian/secguard/scans/sc-20260707-143000-a1b2",
    "source_root": "/path/to/user/project",
    "stripped_root": "/path/to/user/project",  # DEPRECATED (EPIC-009) — same as source_root
    "index_json": ".codeagent/secguardian/index.json",
    "recorder": "$SCRIPTS_DIR/record-finding.py",
    "reporter": "$SCRIPTS_DIR/render-report.py"
  },
  "skill": {
    "id": "buffer_overflow",
    "severity": "critical",
    "cwe": "CWE-120",
    "category": "string",
    "rule": "... rule.md 内容（检测规则 + Scenario + Worker 检视协议）...",
    "references": {
      "exceptions": "... exceptions.md 内容 ...",
      "cross_function": "... cross-function.md 内容 ...",
      "false_positive": "... false-positive.md 内容 ..."
    }
  },
  "signals": [
    {
      "caller": "idm_portal_auth",
      "callee": "strcpy_s",
      "file": "src/ctrlplane/portal/idm_portal_auth.c",
      "line": 142,
      "arguments": ["dst", "sizeof(dst)", "src"],
      "safe_variant": true,
      "category": "string"
    }
  ]
}
```

### 5.2 Worker 执行协议（5 步）

每个 Worker 按以下 5 步协议独立执行。**必须在事实锚定反思通过后才能输出 finding。**

#### Step W1: 信号确认

对每个预筛信号:

1. 读取调用点源码（±15 行，从脱敏副本读取）
2. 确认调用点真实存在（排除注释、宏、条件编译中的误匹配）
3. 记录: `confirmed` / `false_signal`（如为 false_signal 则跳过，记入抑制统计）

```bash
# Worker 内的 bash 调用示例
cat "$SOURCE_ROOT/$FILE" | head -n $((LINE + 15)) | tail -n 31
```

#### Step W2: 证据链构建

构建 Source → Propagate → Sink 三段式证据链:

- **Source**: 危险操作的源（如缓冲区目标 `dst` 的声明和大小，命令注入中的外部输入）
- **Propagate**: 数据从源到汇的传递路径（如外部输入经函数参数传递到危险调用）
- **Sink**: 实际危险操作点（如 `strcpy_s(dst, dsize, src)` 的写入操作）

**证据链示例 (buffer_overflow):**
```
Source:  dst 声明为 char dst[64]  at file.c:130
         src 来自函数参数 const char* input, 无长度校验 at file.c:135
Propagate:  input 作为参数传入 idm_portal_auth() at file.c:140
Sink:  strcpy_s(dst, sizeof(dst), input) at file.c:142
       → sizeof(dst) = 64, input 长度未知
```

**证据链示例 (command_injection):**
```
Source:  HTTP query param "cmd" 来自用户输入 at handler.c:50
Propagate:  未经验证传入 execute_command()  at handler.c:55
Sink:  system(user_input)  at executor.c:80
```

**跨函数追踪约束:**
- 如果 Sink 函数的缓冲区来自调用者，沿 index.json 调用图向上追踪 **最多 1 层**
- 超过 1 层 → 降级为 **suspicious**（不在最终报告中报告为确认漏洞，计入抑制统计）
- 注: 个别 Skill 的 `cross-function.md` 可定义更严格的 depth 限制（如 0），但不允许放松

#### Step W3: 安全变体参数审计

对 `_s` 安全变体调用（`safe_variant: true`），检查参数正确性——**安全变体不意味着自动安全**:

| 函数 | 审计项 |
|------|--------|
| `strcpy_s(dst, dsize, src)` | `dsize` 是否 `== sizeof(dst)`? `dst` 是否为数组（而非指针参数）? |
| `strcat_s(dst, dsize, src)` | `dsize` 是否考虑已有内容? `sizeof(dst) - strlen(dst) >= strlen(src)`? |
| `memcpy_s(dst, dsize, src, n)` | `dsize >= n`? `dsize == sizeof(dst)`? |
| `sprintf_s(buf, size, fmt, ...)` | `size == sizeof(buf)`? `fmt` 含 `%s` 时对应参数是否受控? |
| `snprintf(buf, size, fmt, ...)` | 返回值是否被检查（截断检测）? |

非 `_s` 变体直接进入 Step W4。

#### Step W4: 跨函数补证

沿调用图向上追踪 1 层，确认调用者传入的缓冲区大小或数据源:

1. 在 index.json 中查找调用者函数定义
2. 读取调用者源码（±10 行上下文）
3. 检查调用者是否:
   - 传入已知大小的缓冲区（`char buf[64]` → `process_data(buf, sizeof(buf))`）
   - 传入已检查长度的数据（`if (strlen(src) < MAX)` → `strcpy(dst, src)`）
   - 传入未检查的用户输入（`strcpy(dst, argv[1])` → 直接报告）
4. **depth > 1**（即调用者的调用者）→ 降级为 `suspicious`，不计入确认发现

#### Step W4.5: 多信号归并分析（★ 新增）

当同一函数内有多个信号时，先聚合再逐条分析：

1. 对同一 caller function 的信号按行号分组
2. 检查是否存在**信号间依赖**：
   - buffer_overflow 信号依赖 integer_overflow 信号（整数溢出绕过 size check → buffer overflow 的 Q1 假设失效）
   - lock_misuse 信号需同一函数内 lock/unlock 配对分析
3. 归并后形成统一分析基线：
   - 引用已分析的相邻信号结论（如 Q3 已查明的源数据长度）
   - 避免重复读取同一段源码
4. 在证据链中标注 "cross_signal_analysis: true"

示例: parse_packet 函数有 2 个 memcpy 调用（line 53, line 60）。
- 信号 1 (line 53): memcpy(&packet->header, header, sizeof(PacketHeader)) → 固定大小拷贝，安全
- 信号 2 (line 60): memcpy(packet->data, raw_data+HEADER_SIZE, header->data_size) → 运行时大小，需跨信号分析
- 归并: 确认信号1安全; 信号2需同时检查 integer_overflow 状态

#### Step W5: 事实锚定反思（替代旧 5 轮反思）

**基于 3 个域专用事实锚定问题, 一轮判定, 不再 5 轮空转。**

旧 5 轮反思已被实验证伪:
- 同 LLM 同上下文同框架 → 5 轮产出同质化结论
- Test C (DES key未初始化) 中 5 轮反思全部遗漏该问题
- 事实锚定 Q2 "密钥已正确初始化?" 直接发现

**通用 Q 框架:**
```
Q1: [域专用，迫使检查最关键的"是否有漏洞"条件]
Q2: [域专用，迫使检查条件是否真实（如参数来源、初始化状态）]
Q3: [域专用，迫使检查豁免/补偿条件是否存在]
```

**判定矩阵规则（每个 skill 在各自 SKILL.md 中定义域专用 Q schema）:**

| Q1 | Q2 | Q3 | 结论 |
|----|----|----|------|
| YES(安全) | YES | YES | **SUPPRESS** — 三绿灯，安全可证 |
| YES(安全) | YES | NO | **informational** — 基本安全但有隐患 |
| YES(安全) | NO | — | **CONFIRMED** — 条件不满足即漏洞 |
| NO(危险) | YES | — | **CONFIRMED** — 危险信号已确认 |
| NO(危险) | NO | — | **CONFIRMED** — 多角度证实漏洞 |
| Mixed | Mixed | Mixed | 强制详细分析后判断 |

**执行步骤:**

1. 根据 skill_id 从 SKILL.md 读取域专用 Q1-Q2-Q3
2. 回答 3 个事实锚定问题（仅 Yes/No，答案必须基于源码证据链中的行号引用）
3. 查判定矩阵 → 决定 verdict
4. 三绿灯: 直接抑制，记入抑制统计（含三条证据引用）
5. 确认: 输出 finding（证据链必须引用 Q1-Q2-Q3 的结论）

**与旧 5 轮反思的关键差异:**
- 旧 5 轮是"让 LLM 反思自己"（自我循环，同质结论）
- 事实锚定是"问 LLM 3 个无法回避的事实问题"（域专用，发现盲区）
- 旧 5 轮 = 5 次 LLM 调用 ↓ 新协议 = 1 次 LLM 调用（Step W1-W5 合并在 1 次 Agent 调用中）
- 旧 5 轮在 Test C 遗漏密钥初始化 → 新协议 Q2 直接发现

