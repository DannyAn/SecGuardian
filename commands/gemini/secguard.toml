**盲区报告（当信号全部被抑制时输出）:**

每个 Worker **必须**输出盲区报告到 `$SCAN_DIR/workers/<skill_id>/blindspot.json`:

```json
{
  "skill_id": "buffer_overflow",
  "signals_received": 15,
  "findings_reported": 3,
  "findings_suppressed": 5,
  "false_signals": 7,
