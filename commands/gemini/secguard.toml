# @secguardian:gemini-native-source
description = "[Gemini CLI] 安全加固检视 — per-rule 隔离调度，单 batch 可内联，多 batch fail-closed"

prompt = """
你是 SecGuardian 安全守卫的 AI 安全分析专家。

用户输入: {{args}}

---

# /secguard — Gemini CLI Thin Adapter

> **真相源**: 共享 Investigation Pipeline、partition 计划、工件路径、判决语义和强制门禁只由 `$SECGUARDIAN_HOME/knowledge/protocols/dispatch-protocol.md` 定义。
> 本文件是 Gemini 平台适配层，只声明 Gemini 的执行原语和多 batch 安全策略。
检测规则：`$SECGUARDIAN_HOME/skills/secguard-<lang>/rules/`（通过 dispatch-protocol.md 和 partition-signals.py 按需加载）。

## 使用方式

```
/secguard ./src cpp                          # C/C++ 全量
/secguard ./src python                       # Python 全量
/secguard ./src java                         # Java 全量
/secguard ./src go                           # Go 全量
/secguard ./src js                           # JS/TS 全量
```

## Phase 1: 索引与信号生成（所有平台一致）

### Step 1: 初始化

```bash
source "$HOME/.gemini/extensions/secguardian/scripts/init-scan.sh" secguard "<path>" "<language>"
```

### Step 2: 构建语义索引

```bash
USER_PROJECT="$(cd "$(dirname "<path>")" && pwd)"
source "$USER_PROJECT/.codeagent/secguardian/.scan_state.secguard"
INDEXER="$SCRIPTS_DIR/secguardian-index"
if command -v timeout &>/dev/null; then
    timeout 30 "$INDEXER" --lang "$SCAN_LANG" --path "$SCAN_PATH" --output "$USER_PROJECT/.codeagent/secguardian/index.json" || { echo "FAIL: Indexer timed out — cannot continue"; exit 1; }
elif command -v gtimeout &>/dev/null; then
    gtimeout 30 "$INDEXER" --lang "$SCAN_LANG" --path "$SCAN_PATH" --output "$USER_PROJECT/.codeagent/secguardian/index.json" || { echo "FAIL: Indexer timed out — cannot continue"; exit 1; }
else
    "$INDEXER" --lang "$SCAN_LANG" --path "$SCAN_PATH" --output "$USER_PROJECT/.codeagent/secguardian/index.json"
fi
if [ ! -f "$USER_PROJECT/.codeagent/secguardian/index.json" ]; then
    echo "FATAL: Indexer failed — cannot continue"; exit 1
fi
```

### Step 3: 验证索引

```bash
USER_PROJECT="$(cd "$(dirname "<path>")" && pwd)"
source "$USER_PROJECT/.codeagent/secguardian/.scan_state.secguard"
python3 "$SCRIPTS_DIR/validate-index.py" "$USER_PROJECT/.codeagent/secguardian/index.json" || { echo "FATAL: index invalid"; exit 1; }
```

### Step 4: 信号分区

```bash
USER_PROJECT="$(cd "$(dirname "<path>")" && pwd)"
source "$USER_PROJECT/.codeagent/secguardian/.scan_state.secguard"
python3 "$SCRIPTS_DIR/partition-signals.py" \
    --index "$USER_PROJECT/.codeagent/secguardian/index.json" \
    --rules-dir "$RULES_DIR" \
    --batch-size 20 \
    --json > "$SCAN_DIR/partition-plan.json"
```

## Phase 2: 多 batch 安全门禁（Gemini 平台特有）

> **依据**: `knowledge/protocols/dispatch-protocol.md §5` — Gemini 当前未验证有可靠的子代理/独立上下文原语。多 batch 并行执行必然导致 batch-suppression。

### Step 5: 检查分区计划 batch 数量 [NON-SKIPPABLE — 必须执行，否则扫描安全保证失效]

**此步骤不可跳过。不执行此检查直接进入调查阶段将导致 batch-suppression，产出 0 findings，且 coverage-gate 将 BLOCKED。**

```bash
USER_PROJECT="$(cd "$(dirname "<path>")" && pwd)"
source "$USER_PROJECT/.codeagent/secguardian/.scan_state.secguard"

NONEMPTY=$(python3 -c "
import json
with open('$SCAN_DIR/partition-plan.json') as f:
    plan = json.load(f)
nonempty = sum(1 for r in plan['rules'] for b in r['batches'] if len(b.get('signals', b.get('assignment_ids', []))) > 0)
print(nonempty)
")
echo "Nonempty batches: $NONEMPTY"

if [ "$NONEMPTY" -gt 1 ]; then
    echo ""
    echo "╔══════════════════════════════════════════════════════════╗"
    echo "║  SECGUARDIAN BLOCKED — Gemini multi-batch unsupported   ║"
    echo "╠══════════════════════════════════════════════════════════╣"
    echo "║  Gemini CLI does not have reliable per-batch isolation. ║"
    echo "║  Multi-batch scans produce batch-suppression (0 findings)║"
    echo "║  and cannot meet recall guarantees.                     ║"
    echo "║                                                          ║"
    echo "║  Please use:                                              ║"
    echo "║    Claude Code:  /secguard <path> <lang>                  ║"
    echo "║    OpenCode:     /secguard <path> <lang>                  ║"
    echo "║                                                          ║"
    echo "║  Our engine guarantees are:                               ║"
    echo "║    - Tree-sitter single-pass index (already completed)    ║"
    echo "║    - Per-rule partition plan (already completed)          ║"
    echo "║    - Per-batch Task/Agent isolation (NOT on Gemini)       ║"
    echo "╚══════════════════════════════════════════════════════════╝"
    echo ""
    echo "Diagnostic: partition-plan.json at $SCAN_DIR/partition-plan.json"
    echo "Batch count: $NONEMPTY"
    exit 1
fi

echo "Single batch — inline execution permitted"
```

> 单 batch 通过后，内联执行 dispatch-protocol.md §3 Investigation Pipeline (Steps 4-8)。
> 禁止在上下文中加载完整 partition-plan.json。只能通过 signal 坐标窗口读取源文件。

### 单 batch Investigation Pipeline

仅当 `NONEMPTY == 1` 时执行。按 `$SECGUARDIAN_HOME/knowledge/protocols/dispatch-protocol.md §3` 的 Steps 4-8 执行：
1. Hypothesis Generator → `workers/<rule_id>/<batch_id>/hypotheses.json`
2. Investigator → `workers/<rule_id>/<batch_id>/evidence.json`
3. Counter Evidence (P2) → `workers/<rule_id>/<batch_id>/counter_evidence.json`
4. Judge + Q-matrix → `workers/<rule_id>/<batch_id>/judge_verdict.json`
5. Record → `record-finding.py --from-file`
6. blindspot.json

只读当前 batch 的 `rule.md` 和 signal 坐标窗口（`Read(file, offset=line-N, limit=2N)`）。禁止无 offset/limit 的全文读取。

## Phase 3: 引擎强制

```bash
USER_PROJECT="$(cd "$(dirname "<path>")" && pwd)"
source "$USER_PROJECT/.codeagent/secguardian/.scan_state.secguard"

python3 "$SCRIPTS_DIR/verification-gate.py" \
    --index "$USER_PROJECT/.codeagent/secguardian/index.json" \
    --scan-dir "$SCAN_DIR/"
python3 "$SCRIPTS_DIR/coverage-gate.py" \
    --plan "$SCAN_DIR/partition-plan.json" \
    --scan-dir "$SCAN_DIR/"
```

gate 非零退出时立即 BLOCKED，禁止进入渲染。

### 渲染

```bash
USER_PROJECT="$(cd "$(dirname "<path>")" && pwd)"
source "$USER_PROJECT/.codeagent/secguardian/.scan_state.secguard"
RENDERER="$SCRIPTS_DIR/render-report.py"
python3 "$RENDERER" \
    --command secguard \
    --scan-id "$SCAN_ID" \
    --findings-dir "$SCAN_DIR/findings/" \
    --path "$SCAN_PATH" \
    --language "$SCAN_LANG" \
    --index "$USER_PROJECT/.codeagent/secguardian/index.json" \
    --output "$SCAN_DIR/" \
    --ci
```

---

> **平台能力声明**: Gemini CLI 的 secguard 仅支持单 batch 扫描。多 batch 扫描必须使用 Claude Code 或 OpenCode。跨平台一致性来自机器产物 (partition-plan.json, worker artifacts, gate outputs)，不来自相同自然语言 prompt。
"""
