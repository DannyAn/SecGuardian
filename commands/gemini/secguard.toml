#### 4b. 按信号类型 + category 分组

```
┌─ S1: call_sites ──────────────────────────────────┐
string  → [call_sites where category="string"]
memory  → [call_sites where category="memory"]
io      → [call_sites where category="io"]
exec    → [call_sites where category="exec"]
sync    → [call_sites where category="sync"]
