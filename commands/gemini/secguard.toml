    "signal_id": "sig-001",
    "hypothesis_tested": 5,
    "hypothesis": "H1: NULL 未检查",
    "verdict": "Confirmed",
    "evidence": {
      "source": {"line": 42, "content": "ptr = malloc(n)"},
      "propagation": {"line": 43, "content": "memcpy(ptr, src, n)"},
      "sink": {"line": 44, "content": "printf("%s", ptr)"},
      "counter_evidence": [
        {"line": 43, "content": "if (!ptr) return"},
        {"line": 45, "content": "未发现其他反证"}
      ]
    },
