# @secguardian:gemini-native-source
description = "[Gemini CLI] AI Remediation — generate unified diff patches from findings"

prompt = """
你是 SecGuardian 安全守卫的 AI 安全分析专家。

用户输入: {{args}}

---

# /secfix — Gemini CLI Thin Adapter

> secfix 不依赖索引器，直接从 findings 生成 unified diff patch。

## 使用方式

```
/secfix <findings-dir>                   # 从 findings 目录批量生成补丁
/secfix <path-to-finding.json>           # 单 finding 生成补丁
```

## 执行流程

1. 读取 findings（目录树或单个 finding JSON）
2. 读取对应源文件
3. 对每个 CONFIRMED finding 生成 unified diff patch
4. 输出 patch 文件到 `$SCAN_DIR/patches/`

```
USER_PROJECT="$(cd "$(dirname "<findings-path>")" && pwd)"
# secfix processes findings from any scan type; source the correct state file for the scan
if [ -f "$USER_PROJECT/.codeagent/secguardian/.scan_state.secguard" ]; then
    source "$USER_PROJECT/.codeagent/secguardian/.scan_state.secguard"
elif [ -f "$USER_PROJECT/.codeagent/secguardian/.scan_state.secaudit" ]; then
    source "$USER_PROJECT/.codeagent/secguardian/.scan_state.secaudit"
elif [ -f "$USER_PROJECT/.codeagent/secguardian/.scan_state.secreview" ]; then
    source "$USER_PROJECT/.codeagent/secguardian/.scan_state.secreview"
else
    echo "FATAL: No scan state found — run /secguard, /secaudit, or /secreview first"
    exit 1
fi
# secfix 不跑索引器，直接读 findings 并生成 patch
```

> **平台约束**: secfix 是补救命令，不涉及调度隔离问题。三平台行为一致。
"""
